<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glowstick</title>
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <main class="screen is-boot" id="screen">
    <!-- Blurred full-screen copy of the cover (two layers so we can crossfade) -->
    <img class="bg" id="bg0" alt="" crossorigin="anonymous">
    <img class="bg" id="bg1" alt="" crossorigin="anonymous">
    <div class="veil"></div>
    <div class="edge" aria-hidden="true"></div>
    <canvas class="glowband" id="glowband" aria-hidden="true"></canvas>
    <canvas class="snow" id="snow" aria-hidden="true"></canvas>

    <header class="clock">
      <div class="date" id="date"></div>
      <div class="time" id="time"></div>
    </header>

    <div class="artzone" id="artzone" aria-hidden="true">
      <div class="artglow"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <img class="cover" id="cover0" alt="" crossorigin="anonymous">
      <img class="cover" id="cover1" alt="" crossorigin="anonymous">
    </div>

    <aside class="panel upnext" aria-label="Up next">
      <div class="cap">UP NEXT</div>
      <div id="queue"></div>
    </aside>

    <section class="panel lyrics" aria-label="Lyrics">
      <div class="cap">LYRICS</div>
      <div class="lyrwin" id="lyrwin"><div class="lyrlist" id="lyrlist"></div></div>
    </section>

    <section class="glassplayer">
      <div class="now">
        <div class="nowtext">
          <div class="nowtitle" id="ptitle"></div>
          <div class="small" id="partist"></div>
        </div>
        <div class="label">Playing on Spotify</div>
      </div>
      <div class="progress" id="progress" title="Click to jump"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
      <div class="controls chrome">
        <button class="icon" id="prevBtn" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="play" id="playBtn" type="button" aria-label="Play or pause">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="icon" id="nextBtn" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
      </div>
    </section>

    <div class="toggles chrome">
      <div class="togglebox">
        <button class="toggle" id="upnextToggle" type="button" aria-pressed="false"><span>Up next</span><span class="switch"></span></button>
        <button class="toggle" id="lyricsToggle" type="button" aria-pressed="false"><span>Lyrics</span><span class="switch"></span></button>
      </div>
      <button class="toggle linkbtn" id="copyLink" type="button">Screen saver link</button>
    </div>

    <section class="login" id="login" hidden>
      <h1>Glowstick</h1>
      <p>Shows what you're playing, right on your desktop.</p>
      <button class="loginbtn" id="loginBtn" type="button">Log in with Spotify</button>
      <p class="loginmsg" id="loginMsg" role="alert"></p>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <a class="credit" href="https://reccobeats.com" target="_blank" rel="noopener">Tempo data by ReccoBeats</a>
  </main>

  <script src="app.js?v=17"></script>
</body>
</html>
